name: Unzip starter
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip
        run: |
          unzip -o CreatureWorld-starter.zip
          cp -r CreatureWorld/* .
          rm -rf CreatureWorld CreatureWorld-starter.zip
      - name: Commit extracted files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Extract starter project" || echo "Nothing to commit"
          git push
